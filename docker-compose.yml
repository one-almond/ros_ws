services:
  ros2:
    build: .
    container_name: ros2_Zoomba

    # =====================
    # DEV WORKSPACE MOUNT
    # =====================
    volumes:
      - ./ros_ws:/home/user/ros_ws
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unixS
    # =====================
    # DEVICE ACCESS (Arduino)
    # =====================
    devices:
      - /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0:/dev/ttyLIDAR

    # =====================
    # PRIVILEGES (needed for serial + USB)
    # =====================
    #privileged: true

    # =====================
    # ENVIRONMENT
    # =====================
    environment:
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY}

    network_mode: host
    group_add:
      - dialout  # For serial access permissions
    # =====================
    # INTERACTIVE SHELL
    # =====================
    stdin_open: true
    tty: true

    command: bash
